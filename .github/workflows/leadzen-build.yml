name: Leadzen CRM image

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: leadzen-image
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/leadzenmarketing/leadzen-crm

jobs:
  build:
    # Native arm64 runner: the image targets Apple Silicon and Oracle Ampere, and the front build needs ~8 GB RAM.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      # .leadzen-base holds the Twenty release tag (e.g. twenty/v2.48.0); the server needs APP_VERSION as v-prefixed semver.
      - id: version
        run: |
          base="$(tr -d '[:space:]' < .leadzen-base)"
          app="${base#twenty/}"
          [[ "$app" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Bad .leadzen-base: $base"; exit 1; }
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "semver=${app#v}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/twenty-docker/twenty/Dockerfile
          target: twenty
          platforms: linux/arm64
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.app }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.semver }}
            ${{ env.IMAGE }}:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=Leadzen CRM
            org.opencontainers.image.description=Leadzen CRM by Leadzen Marketing, powered by Twenty
            org.opencontainers.image.source=https://github.com/leadzenmarketing/leadzen-crm
            org.opencontainers.image.licenses=AGPL-3.0
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max
